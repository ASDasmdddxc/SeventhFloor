<style>
    * {

    html, body {

    body {

        color: #fff;
        font-family:

            "PingFang SC",

    }

        width: min(90vw, 720px);
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* 顶部图片 */
    .main-image {
        display: block;
        width: 100%;
        max-height: 420px;
        object-fit: contain;
        margin-bottom: 22px;
    }

    /* 输入框 */
    #passwordInput {
        width: min(85%, 520px);
        height: 58px;
        border: 2px solid #8f78a8;
        border-radius: 0px;
        outline: none;

        background: #30203f;
        color: #fff;
        font-size: 24px;
        text-align: center;
        padding: 0 18px;

        transition: border-color 0.2s, box-shadow 0.2s;
    }

    #passwordInput:focus {
        border-color: #c7b4da;
        box-shadow: 0 0 12px rgba(199, 180, 218, 0.25);
    }

    #passwordInput::placeholder {
        color: #9e91aa;
    }

    /* 输出区域 */
    #output {
        width: min(85%, 520px);
        min-height: 300px;
        margin-top: 22px;
        padding: 30px 28px;

        border: 2px solid #EFDFBB;
        border-radius: 3px;
        background: #301934;

        color: #fff;
        font-size: 22px;
        line-height: 1.8;

        white-space: pre-wrap;
        overflow-wrap: break-word;

        .text-a {

        font-size: 22px;
        font-weight: bold;
}
        .text-b {
        color: #FF68F6;
        font-size: 22px;
        font-weight: bold;
}
        .output-image {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 20px auto;
}

        /* 初始不显示文本 */
        display: none;
    }

    #output.visible {
        display: block;
    }

    @media (max-width: 600px) {
        body {
            padding: 25px 12px;
        }

        .page {
            width: 100%;
        }

        #passwordInput,
        #output {
            width: 92%;
        }

        #passwordInput {
            height: 52px;
            font-size: 20px;
        }

        #output {
            font-size: 19px;
            padding: 24px 20px;
        }
    }
